<!DOCTYPE html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
window.__step = 'imported';
try {
  const loader = new THREE.TextureLoader();
  window.__step = 'loader-created';
  let done = 0, fail = 0;
  const t = loader.load('./assets/textures/cedar/cedar_diff_1k.jpg',
    tex => { done++; window.__step = `loaded ${done} v=${tex.version} img=${!!tex.image}`; },
    undefined,
    err => { fail++; window.__step = `LOAD-ERROR: ${err && err.message ? err.message : err}`; });
  window.__step = 'load-called';
  setTimeout(() => { if (!done && !fail) window.__step = `TIMEOUT img=${!!t.image} version=${t.version}`; }, 4000);
} catch (e) { window.__step = 'THROW: ' + e.message; }
</script></body></html>
