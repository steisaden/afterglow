<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Weather Lab</title><style>html,body{margin:0;overflow:hidden;background:#15202a;color:#eee;font:14px system-ui}#ui,#perf{position:fixed;z-index:2;padding:12px;background:#101820dd}#ui{top:12px;left:12px}#perf{top:12px;right:12px;color:#9fbcaa;white-space:pre}label{display:block;margin:8px}canvas{display:block}</style></head><body><div id="ui"><b>Oklahoma Storm · Weather Lab</b><label>Storm <input id="storm" type="range" min="0" max="1" step=".01" value=".8"><output id="sv"></output></label><label>Wind <input id="wind" type="range" min="-1" max="1" step=".01" value=".35"><output id="wv"></output></label><label>Tier <select id="tier"><option value="heavy">desktop heavy</option><option value="light">desktop light</option><option value="mobile">mobile</option></select><output id="count"></output></label><button id="ramp">Play 0 → 1 → 0</button></div><div id="perf">warming up</div><script type="module" src="weather.js"></script></body></html>
